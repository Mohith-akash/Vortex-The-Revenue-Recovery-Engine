[project]
name = "vortex"
version = "2.0.0"
description = "Real-time revenue recovery engine for e-commerce cart abandonment"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Mohith Akash", email = "mohithakash013@gmail.com"}
]
keywords = ["streaming", "databricks", "azure", "e-commerce", "analytics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "azure-eventhub>=5.11.0",
    "python-dotenv>=1.0.0",
    "faker>=24.0.0",
]

[project.optional-dependencies]
ai = ["cerebras-cloud-sdk>=1.0.0"]
dev = ["ruff>=0.4.0", "pytest>=8.0.0", "pytest-cov>=5.0.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
