# Vortex CI/CD Pipeline

name: Vortex Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        # pinned so a new ruff release can't fail unchanged code (ruff 0.16
        # did exactly that to the olist repo)
        run: pip install ruff==0.16.10

      - name: Run Ruff linter
        run: ruff check . --output-format=github

      - name: Run Ruff formatter check
        run: ruff format --check .

  deploy:
    name: Deploy to Databricks
    runs-on: ubuntu-24.04
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - name: Check for Databricks secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.DATABRICKS_HOST }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Databricks secrets not configured, skipping deploy"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Databricks CLI
        if: steps.check-secrets.outputs.skip != 'true'
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Configure Databricks Auth
        if: steps.check-secrets.outputs.skip != 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          echo "[DEFAULT]" > ~/.databrickscfg
          echo "host = $DATABRICKS_HOST" >> ~/.databrickscfg
          echo "token = $DATABRICKS_TOKEN" >> ~/.databrickscfg

      - name: Deploy notebooks
        if: steps.check-secrets.outputs.skip != 'true'
        run: |
          if [ -d "./notebooks" ]; then
            databricks workspace import-dir ./notebooks /Workspace/Vortex/notebooks --overwrite
            echo "Notebooks deployed to Databricks"
          fi

      - name: Skip notification
        if: steps.check-secrets.outputs.skip == 'true'
        run: echo "Databricks deploy skipped - add DATABRICKS_HOST and DATABRICKS_TOKEN secrets to enable"
