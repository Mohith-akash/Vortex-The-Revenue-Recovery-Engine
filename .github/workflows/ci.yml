# Vortex CI/CD Pipeline

name: Vortex Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        # pinned so a new ruff release can't fail unchanged code (ruff 0.16
        # did exactly that to the olist repo)
        run: pip install ruff==0.16.10

      - name: Run Ruff linter
        run: ruff check . --output-format=github

      - name: Run Ruff formatter check
        run: ruff format --check .

  test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # the app's own pinned requirements: the render test runs every tab
      - name: Install test dependencies
        run: pip install -r streamlit_app/requirements.txt pytest

      - name: Run tests
        run: python -m pytest tests -q
